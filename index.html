<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanakh - Pegasus Framework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fundo de Estrelas -->
    <canvas id="starsCanvas"></canvas>

    <div class="app-container">
        
        <!-- ESTADO 1: A CAPA DO LIVRO -->
        <div id="book-cover" class="book-layer active">
            <div class="spine"></div> <!-- Lombada do livro -->
            <div class="cover-content">
                <h1 class="gold-title">Tanakh</h1>
                <p class="cover-subtitle">PEGASUS OFFLINE READER</p>
                <button id="btn-open-book">Abrir o Livro</button>
                <button id="btn-continue" class="hidden">Continuar Leitura</button>
            </div>
        </div>

        <!-- ESTADO 2: O LIVRO ABERTO -->
        <div id="book-inside" class="book-layer hidden">
            <!-- Cabeçalho Estratégico -->
            <div class="reader-header">
                <button id="btn-close-book" title="Fechar Livro">✕</button>
                <input type="text" id="omni-search" placeholder="Busca Rápida (Ex: gn 1 ou genesis 1 1)" autocomplete="off">
                <!-- Marcador de Fita Visual -->
                <div id="bookmark-ribbon" title="Marcar esta página"></div>
            </div>

            <!-- Área de Leitura -->
            <div class="reader-page" id="display-text">
                <div class="instruction-text">
                    <p>O livro está aberto.</p>
                    <p>Use a barra superior para buscar.</p>
                </div>
            </div>
        </div>

        <footer class="pegasus-footer">
            MADE BY PEGASUS FRAMEWORK
        </footer>
    </div>

    <!-- 1º O Banco de Dados, 2º O Motor -->
    <script src="biblia.js"></script>
    <script src="app.js"></script>
</body>
</html>
